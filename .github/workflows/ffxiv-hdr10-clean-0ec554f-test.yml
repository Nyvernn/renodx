name: FFXIV HDR10 Clean 0ec554f Test

on:
  workflow_dispatch:
  push:
    branches:
      - ci/ffxiv-hdr10-output-clean-0ec554f-test

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64

      - name: Build FFXIV (x64)
        run: cmake --build --preset clang-x64-release --target ffxiv --verbose

      - name: Upload FFXIV addon
        uses: actions/upload-artifact@v4
        with:
          name: ffxiv-hdr10-clean-0ec554f
          path: build/Release/renodx-ffxiv.addon64
          if-no-files-found: error
